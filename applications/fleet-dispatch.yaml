apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-dispatch
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: fleet-dispatch-gitops
  source:
    # The root Application patches these two bootstrap placeholders at render time.
    repoURL: https://example.invalid/fleet-dispatch-gitops.git
    targetRevision: main
    path: apps/fleet-dispatch-helm
    helm:
      releaseName: fleet-dispatch
      valueFiles:
        - values-production.yaml
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers:
        - /spec/replicas
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet-dispatch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
