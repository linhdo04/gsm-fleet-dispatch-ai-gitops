apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-dispatch
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - docker-linhdt.site
      secretName: docker-linhdt-tls
  rules:
    - host: docker-linhdt.site
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
