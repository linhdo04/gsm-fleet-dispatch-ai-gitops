apiVersion: v1
kind: ResourceQuota
metadata:
  name: fleet-dispatch-quota
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    persistentvolumeclaims: "0"
    services: "10"
    count/networkpolicies.networking.k8s.io: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: fleet-dispatch-limits
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
