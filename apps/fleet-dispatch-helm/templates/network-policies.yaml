{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "fleet-dispatch.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-frontend
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "fleet-dispatch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fleet-dispatch.frontendSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.ingressControllerLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-backend
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "fleet-dispatch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fleet-dispatch.backendSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicies.ingressControllerLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "fleet-dispatch.frontendSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
{{- end }}
